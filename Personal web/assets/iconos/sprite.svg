<!-- ═══════════════════════════════════════════════════════════
     SPRITE DE ICONOS
     Cada icono es un <symbol> y se usa en el HTML/JS así:
       <svg viewBox="0 0 24 24"><use href="#icono-nombre"/></svg>
     Los trazos usan currentColor: heredan el color del elemento
     donde se apoyan, así los hover siguen funcionando.
     Para agregar un icono: copiá un <symbol>, cambiale el id y el path.
     ═══════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">

  <!-- Trazo grueso (carta de skills) -->
  <symbol id="icono-cerrar" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/>
  </symbol>
  <symbol id="icono-flecha-izq" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" d="M14 6l-6 6 6 6"/>
  </symbol>
  <symbol id="icono-flecha-der" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" d="M10 6l6 6-6 6"/>
  </symbol>

  <!-- Trazo fino (visor de imágenes) -->
  <symbol id="icono-cerrar-fino" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" d="M5 5l14 14M19 5 5 19"/>
  </symbol>
  <symbol id="icono-flecha-izq-fina" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" d="M15 4l-8 8 8 8"/>
  </symbol>
  <symbol id="icono-flecha-der-fina" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" d="M9 4l8 8-8 8"/>
  </symbol>

  <!-- Footer -->
  <symbol id="icono-descarga" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/>
  </symbol>
  <symbol id="icono-linkedin" viewBox="0 0 24 24">
    <path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.64h.05a4.17 4.17 0 0 1 3.75-2.06c4.01 0 4.75 2.64 4.75 6.07V21h-4v-5.5c0-1.31-.02-3-1.83-3-1.83 0-2.11 1.43-2.11 2.9V21h-4V9Z"/>
  </symbol>
  <symbol id="icono-whatsapp" viewBox="0 0 24 24">

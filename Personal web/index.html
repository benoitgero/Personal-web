<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerónimo Benoit — Infraestructura y arquitectura de sistemas</title>
<meta name="description" content="Combino la pasión por la tecnología con una mentalidad de diseño. Windows Server, virtualización y nube.">

<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<!-- Todo el CSS entra por acá: css/main.css importa el resto en orden -->
<link rel="stylesheet" href="css/main.css">

<script>
/* Si esta sesión ya pasó la verificación, se marca el html ANTES del
   primer render y el portal no llega a mostrarse ni un frame. */
try { if (sessionStorage.getItem("portal-ok")) document.documentElement.classList.add("verificado"); } catch (e) {}
</script>
</head>
<body>

<!-- ══════════ VERIFICACIÓN DE ENTRADA ══════════
     Pantalla de carga que filtra bots simples: exige un navegador
     que ejecute JS de verdad. Se muestra una vez por sesión.
     NOTA: este bloque vive acá (y no en un partial) a propósito:
     tiene que renderizarse en el primer frame, antes de que el
     cargador de partials traiga el resto del sitio. -->
<div class="portal" id="portal" aria-hidden="true">
  <div class="portal__nucleo">
    <div class="portal__logo">G</div>
    <div class="portal__leds" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="portal__texto" id="portal-texto">Verificando el navegador…</p>
  </div>
  <noscript>
    <p class="portal__noscript">
      Este sitio necesita JavaScript para verificar que no sos un robot.
      Activalo y recargá la página.
    </p>
  </noscript>
</div>

<a class="saltar" href="#contenido">Saltar al contenido</a>

<!-- ══════════ HEADER ══════════ -->
<div data-include="partials/header.html"></div>

<main id="contenido">
  <!-- Cada sección vive en su propio archivo dentro de partials/secciones/ -->
  <div data-include="partials/secciones/sobre-mi.html"></div>
  <div data-include="partials/secciones/historias.html"></div>
  <div data-include="partials/secciones/proyectos.html"></div>
  <div data-include="partials/secciones/banda.html"></div>
  <div data-include="partials/secciones/contacto.html"></div>
</main>

<!-- ══════════ FOOTER ══════════ -->
<div data-include="partials/footer.html"></div>

<!-- Punto de entrada del JS (módulos ES) -->
<script type="module" src="js/main.js"></script>
</body>
</html>

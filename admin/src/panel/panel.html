<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Gerónimo Benoit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231fbcc4'/%3E%3Cstop offset='1' stop-color='%230b6f75'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/panel.css">

<body>

<header class="barra">
  <div class="marca">
    <span class="esfera" aria-hidden="true"></span>
    <div>
      <strong>Panel</strong>
      <small id="quien">…</small>
    </div>
  </div>

  <div class="estado" id="estado" hidden>
    <span class="punto"></span>
    <span id="estado-texto"></span>
  </div>

  <nav class="acciones">
    <a class="boton boton--plano" id="ver-sitio" href="#" target="_blank" rel="noopener">Ver sitio</a>
    <a class="boton boton--plano" href="/vista/" target="_blank" rel="noopener">Vista previa</a>
    <button class="boton boton--primario" id="publicar" type="button" disabled>Publicar</button>
  </nav>
</header>

<nav class="pestanas" id="pestanas" aria-label="Secciones"></nav>

<main id="principal">
  <p class="cargando">Cargando…</p>
</main>

<footer class="pie" id="pie" hidden>
  <span id="pie-repo"></span>
  <button class="enlace" id="reimportar" type="button">Reimportar desde GitHub</button>
</footer>

<div class="avisos" id="avisos" aria-live="polite"></div>

<input type="file" id="selector" hidden>

<script type="module" src="/panel.js"></script>

</html>

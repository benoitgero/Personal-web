<!-- ══════════ HEADER ══════════
     El logo queda inline (y no en el sprite de iconos) porque usa la
     fuente Playfair del documento: dentro de un <img> externo no cargaría. -->
<header class="barra">
  <div class="barra__interior">

    <a class="marca" href="#contenido" aria-label="Gerónimo — inicio" translate="no">
      <!-- Logo: esfera turquesa con la G, nombre en Playfair Display.
           Técnica: inversión por recorte. El nombre se dibuja dos veces:
           oscuro sobre el fondo, y blanco con contorno solo dentro de la
           esfera. Cada parte queda con el contraste que le corresponde
           (blanco sobre fondo claro daba 1.24:1). Las sombras son las
           entintadas del sitio, no negras. -->
      <svg class="marca__logo" viewBox="0 0 540 140" width="270" height="70"
           role="img" aria-hidden="true" focusable="false">
        <defs>
          <!-- Turquesa de los LEDs arriba, más profundo abajo: la G blanca gana contraste -->
          <linearGradient id="logo-esfera" x1=".2" y1="0" x2=".8" y2="1">
            <stop offset="0"  stop-color="#1fbcc4"/>
            <stop offset=".5" stop-color="#139ea6"/>
            <stop offset="1"  stop-color="#0b6f75"/>
          </linearGradient>
          <!-- Brillo especular pequeño y arriba, para no lavar la G -->
          <radialGradient id="logo-brillo" cx=".26" cy=".18" r=".38">
            <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <!-- Relieve del sitio: sombra entintada abajo, luz blanca arriba -->
          <filter id="logo-relieve" x="-35%" y="-35%" width="170%" height="170%">
            <feDropShadow dx="5" dy="6" stdDeviation="6" flood-color="#8a9bb6" flood-opacity=".6"/>
            <feDropShadow dx="-4" dy="-4" stdDeviation="4" flood-color="#fff" flood-opacity=".9"/>
          </filter>
          <!-- Letra grabada, como los títulos: luz abajo a la derecha -->
          <filter id="logo-grabado" x="-5%" y="-10%" width="110%" height="130%">
            <feDropShadow dx="1.2" dy="1.6" stdDeviation=".6" flood-color="#fff" flood-opacity=".9"/>
          </filter>
          <!-- Sombra corta que despega la parte blanca de la esfera -->
          <filter id="logo-sobre" x="-5%" y="-10%" width="110%" height="130%">
            <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.4" flood-color="#064a4e" flood-opacity=".5"/>
          </filter>
          <clipPath id="logo-dentro"><circle cx="96" cy="70" r="60"/></clipPath>
          <text id="logo-nombre" x="34" y="101"
                font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
                font-size="94" font-weight="500" letter-spacing="-.5">Gerónimo</text>
        </defs>

        <circle cx="96" cy="70" r="60" fill="url(#logo-esfera)" filter="url(#logo-relieve)"/>
        <circle cx="96" cy="70" r="60" fill="url(#logo-brillo)"/>

        <!-- Capa 1: oscura, donde el nombre cae sobre el fondo -->
        <use href="#logo-nombre" fill="#2f3640" filter="url(#logo-grabado)"/>

        <!-- Capa 2: blanca con contorno, recortada a la esfera -->
        <g clip-path="url(#logo-dentro)">
          <use href="#logo-nombre" fill="#fff" stroke="#0a5a5f" stroke-width="1.6"
               paint-order="stroke" filter="url(#logo-sobre)"/>
        </g>
      </svg>
    </a>

    <button class="menu-btn" aria-expanded="false" aria-controls="nav-principal">
      <span class="menu-btn__barra"></span>
      <span class="visually-hidden">Abrir menú</span>
    </button>

    <nav class="nav" id="nav-principal" aria-label="Secciones">
      <ul class="nav__lista">
        <li><a class="nav__enlace" href="#sobre-mi">Sobre mí</a></li>
        <li><a class="nav__enlace" href="#historias">Historias</a></li>
        <li><a class="nav__enlace" href="#proyectos">Proyectos</a></li>
        <li><a class="nav__enlace" href="#contacto">Contacto</a></li>
      </ul>
    </nav>

    <!-- Traducción ES/EN. El estado (aria-checked) lo maneja
         js/componentes/traductor.js; acá arranca siempre en español. -->
    <button class="idioma" type="button" role="switch" translate="no"
            aria-checked="false" aria-label="Traducir la página al inglés">
      <span class="idioma__pastilla" aria-hidden="true"></span>
      <span class="idioma__opcion idioma__opcion--es">ES</span>
      <span class="idioma__opcion idioma__opcion--en">EN</span>
    </button>

  </div>
</header>

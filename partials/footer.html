<!-- ══════════ FOOTER ══════════
     Los iconos salen del sprite: assets/iconos/sprite.svg -->
<footer class="pie">
  <div class="pie__barra"></div>

  <div class="pie__acciones">
    <!-- Desplegable con las cuatro versiones del CV.
         La lógica vive en js/componentes/cv.js -->
    <div class="cv" id="cv">
      <!-- El texto visible es solo "CV"; el aria-label mantiene la acción
           completa para quien navega con lector de pantalla. -->
      <button class="pie__cv" id="cv-boton" type="button" aria-label="Descargar CV"
              aria-expanded="false" aria-controls="cv-menu" aria-haspopup="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icono-descarga"/></svg>
        CV
        <svg class="cv__chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      <ul class="cv__menu" id="cv-menu" role="menu" hidden>
        <li class="cv__grupo" role="presentation">Español</li>
        <li role="none">
          <a class="cv__opcion" role="menuitem" download
             href="cv/CV-Geronimo-Benoit-ES-sin-foto.pdf">Sin foto</a>
        </li>
        <li role="none">
          <a class="cv__opcion" role="menuitem" download
             href="cv/CV-Geronimo-Benoit-ES-con-foto.pdf">Con foto</a>
        </li>

        <li class="cv__grupo" role="presentation">English</li>
        <li role="none">
          <a class="cv__opcion" role="menuitem" download
             href="cv/CV-Geronimo-Benoit-EN-sin-foto.pdf">No photo</a>
        </li>
        <li role="none">
          <a class="cv__opcion" role="menuitem" download
             href="cv/CV-Geronimo-Benoit-EN-con-foto.pdf">With photo</a>
        </li>
      </ul>
    </div>

    <nav class="pie__redes" aria-label="Redes">
      <a class="red" href="https://www.linkedin.com/in/ger%C3%B3nimo-benoit-5b4021152/"
         target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (se abre en otra pestaña)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icono-linkedin"/></svg>
      </a>

      <a class="red" href="https://wa.me/59895929064"
         target="_blank" rel="noopener noreferrer" aria-label="WhatsApp (se abre en otra pestaña)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icono-whatsapp"/></svg>
      </a>
    </nav>
  </div>
</footer>
